<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - HelpDesk TI</title>

    <link rel="stylesheet" href="CSS/login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">
                <h1>Criar conta</h1>
                <p>Cadastre-se para abrir chamados</p>
            </div>

            <form id="registerForm">

                <div class="input-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="nome" placeholder="Seu nome" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="senha" placeholder="Crie uma senha" minlength="6" required>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirmar senha</label>
                    <input type="password" id="confirmPassword" name="confirmarSenha" placeholder="Repita sua senha" minlength="6" required>
                </div>

                <p id="registerMessage" role="status"></p>

                <button type="submit">Criar conta</button>

            </form>

            <p class="register-prompt">
                Já tem uma conta?
                <a href="index.html">Voltar para o login</a>
            </p>

        </section>

    </main>

    <script src="JS/cadastro.js"></script>

</body>

</html>
