<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HelpDesk TI - Login</title>

    <link rel="stylesheet" href="CSS/login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">
                <h1>HelpDesk TI</h1>
                <p>Gestão de Chamados</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="gmail" placeholder="Gmail" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="senha" placeholder="Senha" required>
                </div>

                <div class="forgot-password">
                    <a href="recuperar-senha.html">Esqueci minha senha</a>
                </div>

                <button type="submit">Entrar</button>

                <p id="loginMessage"></p>

            </form>

            <p class="register-prompt">
                Não tem uma conta?
                <a href="cadastro.html">Criar conta</a>
            </p>

            <div class="login-footer">
                <p>Problemas para acessar?</p>
                <a href="recuperar-senha.html">Solicite a recuperação da senha</a>
            </div>

        </section>

    </main>


    <script src="JS/login.js"></script>

</body>
</html>
